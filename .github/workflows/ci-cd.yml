name: Shorty URL CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test:
    name: Build, Test & Package
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Validate Maven wrapper
        uses: maven-wrappers/validate-maven-wrapper-action@v0.1.0

      - name: Run Tests
        run: mvn -B test --file pom.xml

      - name: Build JAR
        run: mvn -B package -DskipTests --file pom.xml

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            target/surefire-reports/
            target/site/

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shorty-url-jar
          path: target/*.jar

  quality-check:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: 📏 Spotless (code style)
        run: mvn spotless:check

      - name: ✅ Checkstyle
        run: mvn checkstyle:check

  deploy-jar:
    name: Deploy JAR
    needs: [build-test, quality-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 📥 Download JAR
        uses: actions/download-artifact@v4
        with:
          name: shorty-url-jar
          path: dist/

      - name: 📤 Release JAR
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'release')
        with:
          files: dist/*.jar
          tag_name: v${{ github.run_number }}
          name: Shorty URL v${{ github.run_number }}
          body: |
            ## Shorty URL Release
            - All tests passed
            - Code quality OK
            - JAR ready for deployment

  summary:
    name: Build Summary
    needs: [build-test, quality-check, deploy-jar]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: 📈 Status Summary
        run: |
          echo "CI/CD Pipeline Status:"
          echo "- Build & Tests: ${{ needs.build-test.result }}"
          echo "- Code Quality: ${{ needs.quality-check.result }}"
          echo "- Deploy: ${{ needs.deploy-jar.result || 'skipped' }}"
          echo "Pipeline ${{ job.status }}!"
  
